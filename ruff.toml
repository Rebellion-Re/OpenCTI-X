target-version = "py311"
line-length = 120

exclude = [
    ".git",
    ".venv",
    "venv",
    "data",
    "__pycache__",
    "build",
    "dist",
]

[lint]
select = ["E", "F"]
ignore = [
    "E501",  # Line too long
    "W605",  # Invalid escape sequence in regex
    "F841",  # Unused variable
    "E402",  # Module-level import not at top of file
    "E722",  # Bare except
    "F401",  # Unused imports
]
