name: CI Quality Assurance & Test Suite

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpango-1.0-0 libharfbuzz0b libpangoft2-1.0-0

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Static Code Analysis with Ruff
        continue-on-error: true
        run: |
          ruff check . --ignore F401,E501,W605,F841,E402,E722 --exclude data

      - name: Run Type Checking with Mypy
        continue-on-error: true
        run: |
          mypy database/ utils/ config/ --ignore-missing-imports

      - name: Execute Pytest Suite
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -v
