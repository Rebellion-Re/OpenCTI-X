name: Continuous Threat Intelligence Ingestion Engine

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

concurrency:
  group: cti-ingestion
  cancel-in-progress: false

jobs:
  harvest-and-correlate:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpango-1.0-0 libharfbuzz0b libpangoft2-1.0-0

      - name: Install Python Package Ecosystem
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Automated Ingestion Pipeline
        env:
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          python -c "
          from utils.ingest import run_pipeline
          from core.correlation.graph_engine import KnowledgeGraphEngine
          from database.gdrive_sync import GoogleDriveSync

          print('Executing Feed Ingestion...')
          run_pipeline()

          print('Recompiling Knowledge Graph...')
          ge = KnowledgeGraphEngine()
          ge.build_graph_from_lake()

          print('Mirroring Lakehouse to Google Drive...')
          gdrive = GoogleDriveSync()
          if gdrive.is_connected():
              gdrive.sync_lakehouse_to_drive()
          "

      - name: Commit and Push Lakehouse Parquet Updates
        run: |
          git config user.name "ThreatFusion Ingestion Bot"
          git config user.email "threatfusion-bot@users.noreply.github.com"
          git add data/processed/ data/graph/
          timestamp=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          if git diff --staged --quiet; then
            echo "No structural telemetry modifications detected."
          else
            git commit -m "Auto-Ingest: Threat Intelligence Sync ${timestamp} [skip ci]"
            git push origin HEAD:${{ github.ref }}
          fi
