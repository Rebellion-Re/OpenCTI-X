name: Upstream Knowledge Base Sync (MITRE ATT&CK & CISA KEV)

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  sync-upstream:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Synchronize Upstream Catalogs
        run: |
          python -c "
          from core.mitre.database import MitreDatabase
          print('Synchronizing MITRE ATT&CK STIX 2.1 taxonomy...')
          mdb = MitreDatabase()
          mdb.sync_from_upstream(force_refresh=True)
          "

      - name: Commit Updated Taxonomy
        run: |
          git config user.name "ThreatFusion Taxonomy Bot"
          git config user.email "threatfusion-bot@users.noreply.github.com"
          git add data/processed/mitre_*.parquet
          if git diff --staged --quiet; then
            echo "MITRE ATT&CK taxonomy is up to date."
          else
            git commit -m "Chore: Synchronize Canonical MITRE ATT&CK Framework [skip ci]"
            git push origin HEAD:${{ github.ref }}
          fi
